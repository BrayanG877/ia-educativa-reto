<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - IA Educativa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            padding: 36px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
        }

        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #667eea; font-size: 26px; margin-bottom: 8px; }
        .logo p { color: #666; font-size: 14px; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group .hint { color: #999; font-size: 12px; margin-top: 4px; }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .btn-register {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .message.show { display: block; }
        .message.error { background: #fee; color: #c33; }
        .message.success { background: #efe; color: #3c3; }

        .loading { text-align: center; color: #667eea; font-size: 14px; margin-top: 10px; }

        .link-row { margin-top: 20px; padding-top: 18px; border-top: 1px solid #e0e0e0; text-align: center; }
        .link-row p { color: #666; font-size: 14px; }
        .link-row a { color: #667eea; font-weight: 600; text-decoration: none; }
        .link-row a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>🎓 Crear cuenta</h1>
            <p>Únete y aprende con inteligencia artificial</p>
        </div>

        <div id="message" class="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Nombre completo</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required
                           pattern="[A-Za-z0-9]+" minlength="3" maxlength="30">
                    <div class="hint">Solo letras y números (3-30)</div>
                </div>
                <div class="form-group">
                    <label for="gradeLevel">Grado</label>
                    <select id="gradeLevel" name="gradeLevel">
                        <option value="">--</option>
                        <option value="6">Sexto</option>
                        <option value="7">Séptimo</option>
                        <option value="8">Octavo</option>
                        <option value="9">Noveno</option>
                        <option value="10">Décimo</option>
                        <option value="11">Once</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="institution">Institución (opcional)</label>
                <input type="text" id="institution" name="institution">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <div class="hint">Mínimo 6 caracteres</div>
                </div>
                <div class="form-group">
                    <label for="passwordConfirm">Confirmar</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerButton">Crear cuenta</button>
        </form>

        <div id="loadingMessage" class="loading" style="display:none;">Creando tu cuenta...</div>

        <div class="link-row">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const registerButton = document.getElementById('registerButton');
        const messageBox = document.getElementById('message');
        const loadingMessage = document.getElementById('loadingMessage');

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = 'message show ' + type;
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const institution = document.getElementById('institution').value.trim();
            const gradeLevel = document.getElementById('gradeLevel').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            // Validación de cliente (el backend valida de nuevo; esto es sólo UX)
            if (password !== passwordConfirm) {
                showMessage('Las contraseñas no coinciden.', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = 'Creando...';
            loadingMessage.style.display = 'block';

            const result = await authManager.register({
                email, password, username, fullName, gradeLevel, institution
            });

            registerButton.disabled = false;
            registerButton.textContent = 'Crear cuenta';
            loadingMessage.style.display = 'none';

            if (result.success) {
                showMessage('¡Cuenta creada! Redirigiendo...', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } else {
                showMessage(result.message || 'No se pudo crear la cuenta.', 'error');
            }
        });

        // Si ya hay sesión, ir directo a la app
        if (authManager.isAuthenticated()) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
